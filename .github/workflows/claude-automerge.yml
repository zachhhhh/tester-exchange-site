name: Claude auto-merge

# Merges pull requests opened by Claude (body has the "Generated with/by [Claude Code]" footer)
# once every other check on the PR has passed. Zach asked for this on 2026-10-31.
# Merges made with GITHUB_TOKEN don't fire push workflows, so afterwards this
# dispatches each workflow that runs on push to main and whose paths match the change.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: claude-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(github.event.pull_request.body, 'Generated with [Claude Code]') || contains(github.event.pull_request.body, 'Generated by [Claude Code]'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Wait for other checks
        run: |
          sleep 20
          for i in $(seq 1 90); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name != "merge")]')
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(echo "$runs" | jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not))] | length')
            if [ "$failed" != "0" ]; then echo "::error::A check failed; not merging"; echo "$runs" | jq -r '.[] | "\(.name) \(.conclusion)"'; exit 1; fi
            if [ "$pending" = "0" ]; then echo "All other checks passed"; exit 0; fi
            sleep 20
          done
          echo "::error::Checks still running after 30 minutes"; exit 1
      - name: Merge
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename' > /tmp/changed.txt
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" -f merge_method=squash --jq .message
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Run the push workflows this merge would have started
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import fnmatch, glob, os, subprocess, yaml
          base = os.environ["BASE"]
          changed = open("/tmp/changed.txt").read().split()
          def match(pats, f):
              return any(fnmatch.fnmatch(f, p) or fnmatch.fnmatch(f, p.rstrip("*") + "*") for p in pats)
          for wf in glob.glob(".github/workflows/*.y*ml"):
              if wf.endswith("claude-automerge.yml"):
                  continue
              try:
                  on = yaml.safe_load(open(wf)).get(True) or {}
              except Exception:
                  continue
              if not isinstance(on, dict) or "workflow_dispatch" not in on or "push" not in on:
                  continue
              push = on["push"] or {}
              branches = push.get("branches")
              if branches and base not in branches:
                  continue
              paths = push.get("paths")
              if paths and not any(match(paths, f) for f in changed):
                  continue
              name = os.path.basename(wf)
              print("Dispatching", name)
              subprocess.run(["gh", "workflow", "run", name, "--ref", base], check=False)
          PY
